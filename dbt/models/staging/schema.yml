version: 2

models:
  - name: stg_fx_rates
    description: >
      Cleaned, typed, and deduplicated foreign exchange rates from the raw Iceberg table.
      Filters null/non-positive rates, then deduplicates by (date, base, target) preferring ECB over Frankfurter.
    columns:
      - name: trading_date
        description: Trading date, cast from string to date.
        tests:
          - not_null  # quality.py: check_no_nulls(df, "date")
      - name: data_source
        description: Upstream data provider (frankfurter or ecb).
        tests:
          - not_null  # quality.py: check_required_columns (implicit not-null)
          - accepted_values:  # quality.py: check_value_in_set(df, "source", {"frankfurter", "ecb"}) — WARNING level
              arguments:
                values: ['frankfurter', 'ecb']
              config:
                severity: warn
      - name: base_currency
        description: Base currency code.
        tests:
          - not_null  # quality.py: check_required_columns
      - name: target_currency
        description: Target currency code.
        tests:
          - not_null  # quality.py: check_required_columns
      - name: exchange_rate
        description: Exchange rate value, cast to decimal(18,8).
        tests:
          - not_null  # quality.py: check_no_nulls(df, "rate")
          - positive_values  # quality.py: check_positive_values(df, "rate")
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trading_date
              - base_currency
              - target_currency

  - name: stg_economic_indicators
    description: >
      Cleaned, typed, and deduplicated economic indicator observations from the raw Iceberg table.
      Filters null values and sentinel "." values, then deduplicates by (date, series_id).
    columns:
      - name: observation_date
        description: Observation date, cast from string to date.
        tests:
          - not_null  # quality.py: check_no_nulls(df, "date")
      - name: data_source
        description: Upstream data provider.
        tests:
          - not_null  # quality.py: check_required_columns (implicit not-null)
          - accepted_values:  # quality.py: (extensibility — validates known sources)
              arguments:
                values: ['fred']
      - name: series_id
        description: Indicator series identifier (e.g. UNRATE).
        tests:
          - not_null  # quality.py: check_required_columns
      - name: observation_value
        description: Observation value, cast to decimal(18,4).
        tests:
          - not_null  # quality.py: check_no_nulls(df, "value")
          - positive_values  # quality.py: (extends coverage — economic values should be positive)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - observation_date
              - series_id
