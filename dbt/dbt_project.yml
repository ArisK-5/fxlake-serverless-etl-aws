name: fxlake_dbt
version: 1.0.0
config-version: 2

profile: fxlake

model-paths: [models]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]

clean-targets:
  - target
  - dbt_packages

models:
  fxlake_dbt:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
      +table_type: iceberg
      +format: parquet
