name: CI

on:
  pull_request:
    branches: [main, fxlake-v2-production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-lint-test:
    name: Python — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=lambda --cov=glue --cov-report=term-missing --cov-fail-under=80

  terraform-validate:
    name: Terraform — Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create stub Lambda zips for validation
        # filebase64sha256() evaluates at validate time; stubs satisfy the function
        # without running a real package build in CI.
        run: |
          touch lambda/lambda_ingestion_function.zip
          touch lambda/lambda_ecb_ingestion.zip
          touch lambda/lambda_fred_ingestion.zip
          touch lambda/lambda_validation_function.zip

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform
